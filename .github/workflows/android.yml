name: Android Debug APK

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install Android 36 SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Install locked npm dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Android bundle and generate native project
        run: |
          npm run build:android
          if [ ! -f android/gradlew ]; then
            npm run android:add
          fi
          npx cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: geo-quiz-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
