name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    uses: naoiw/.github/.github/workflows/reusable-node-ci.yml@3f1b5f2dedeca0bbdd2cf640b4ab189fa28b77fb
    with:
      package-manager: npm
      node-version: "26"
      run-lint: true
      run-typecheck: true
      run-tests: true
      run-build: true
