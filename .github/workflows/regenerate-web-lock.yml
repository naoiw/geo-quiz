name: Regenerate Web-only npm lockfile (temporary)

on:
  push:
    branches: [chore/remove-android-app]
    paths:
      - '.github/workflows/regenerate-web-lock.yml'

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Regenerate dependency graph
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if grep -qi '@capacitor/' package-lock.json; then
            echo 'Capacitor packages were not pruned' >&2
            exit 1
          fi
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already current'
          else
            git commit -m "chore: prune Capacitor dependencies from npm lockfile"
            git push origin HEAD:chore/remove-android-app
          fi
