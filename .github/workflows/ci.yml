name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    uses: naoiw/.github/.github/workflows/reusable-node-ci.yml@00047e65d7e53551e2644df02d2f22743ea2c471
    with:
      package-manager: npm
      node-version: "26"
      run-lint: true
      run-typecheck: true
      run-tests: true
      run-build: true
