name: Bootstrap tracked Android project (temporary)

on:
  push:
    branches: [feature/15-native-project-back-navigation]
    paths:
      - '.github/workflows/bootstrap-native.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: Resolve compatible Capacitor App 8 plugin
        run: npm install --no-audit --no-fund
      - name: Generate native Android source
        run: |
          npm run build:android
          npm run android:add
          npm run android:sync
          test -f android/gradle/wrapper/gradle-wrapper.jar
          test -f android/app/src/main/AndroidManifest.xml
      - name: Commit the checked-in native template
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android package-lock.json
          git diff --cached --stat
          git commit -m "feat(android): track Capacitor 8 native project and Gradle wrapper"
          git push origin HEAD:feature/15-native-project-back-navigation
